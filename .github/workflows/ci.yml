name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      # Type check, tests, production build.
      - run: npm run check

  smoke:
    # Starts a real Obsidian (the oldest version the plugin supports and the latest release) on a
    # throwaway vault and drives the plugin; see scripts/smoke/. No Slack token is involved.
    name: smoke (Obsidian ${{ matrix.obsidian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        obsidian: [min, latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pick the Obsidian version
        id: obsidian
        env:
          GH_TOKEN: ${{ github.token }}
          WHICH: ${{ matrix.obsidian }}
        run: |
          if [ "$WHICH" = min ]; then
            version=$(node -p "require('./manifest.json').minAppVersion")
          else
            version=$(gh release view --repo obsidianmd/obsidian-releases --json tagName -q .tagName)
            version=${version#v}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: cache
        with:
          path: ~/obsidian/${{ steps.obsidian.outputs.version }}
          key: obsidian-${{ steps.obsidian.outputs.version }}-linux-x64

      - name: Download Obsidian
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.obsidian.outputs.version }}
        run: |
          mkdir -p "$HOME/obsidian/$VERSION"
          gh release download "v$VERSION" --repo obsidianmd/obsidian-releases \
            --pattern "obsidian-$VERSION.tar.gz" --output - | tar xz -C "$HOME/obsidian/$VERSION"

      - name: Install what Electron needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libcups2t64 libxkbcommon0 libdrm2

      - name: Smoke test
        env:
          VERSION: ${{ steps.obsidian.outputs.version }}
        run: OBSIDIAN_BIN="$HOME/obsidian/$VERSION/obsidian-$VERSION/obsidian" xvfb-run -a npm run smoke
